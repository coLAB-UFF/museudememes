name: Deploy para GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll (produção)
        # _config_prod.yml: url="https://colab-uff.github.io", baseurl=""
        # Manter baseurl="" evita que relative_url duplique paths que já
        # começam com /museudememes/ (links da navegação, permalinks, etc.)
        run: bundle exec jekyll build --config _config.yml,_config_prod.yml
        env:
          JEKYLL_ENV: production

      - name: Corrigir caminhos de assets para GitHub Pages
        # Com baseurl="" e o site em /museudememes/, todos os /assets/ e
        # /images_static/ precisam virar /museudememes/assets/ e
        # /museudememes/images_static/ nos HTML gerados.
        # O sed cobre: src=, href=, srcset=, content= (meta OG) e url() inline.
        run: |
          fix_assets() {
            sed -i \
              -e 's|"/assets/|"/museudememes/assets/|g' \
              -e "s|'/assets/|'/museudememes/assets/|g" \
              -e 's|url(/assets/|url(/museudememes/assets/|g' \
              -e 's|"/images_static/|"/museudememes/images_static/|g' \
              -e "s|'/images_static/|'/museudememes/images_static/|g" \
              -e 's|url(/images_static/|url(/museudememes/images_static/|g' \
              "$1"
          }
          export -f fix_assets
          # Páginas do museudememes
          find _site/museudememes -name "*.html" -exec bash -c 'fix_assets "$1"' _ {} \;
          # Página 404 (fica na raiz do _site, fora de museudememes/)
          [ -f _site/404.html ] && fix_assets _site/404.html

      - name: Montar diretório de deploy
        # Raiz do gh-pages = conteúdo de _site/museudememes/ + _site/assets/ + _site/images_static/
        # Resultado: colab-uff.github.io/museudememes/ serve o site corretamente
        run: |
          mkdir -p _deploy
          cp -r _site/museudememes/. _deploy/
          cp -r _site/assets         _deploy/assets
          cp -r _site/images_static  _deploy/images_static
          cp    _site/404.html       _deploy/
          cp    _site/sitemap.xml    _deploy/ 2>/dev/null || true
          cp    _site/feed.xml       _deploy/ 2>/dev/null || true
          touch _deploy/.nojekyll

      - name: Enviar artefato para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
