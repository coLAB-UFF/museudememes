name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll (produção)
        run: bundle exec jekyll build --config _config.yml,_config_prod.yml
        env:
          JEKYLL_ENV: production

      - name: Corrigir caminhos hardcoded de assets
        # Substitui /assets/ por /museudememes/assets/ nos HTML gerados,
        # cobrindo as refs que não usam o filtro relative_url do Liquid.
        run: |
          find _site/museudememes -name "*.html" \
            -exec sed -i \
              -e 's|="/assets/|="/museudememes/assets/|g' \
              -e 's|srcset="/assets/|srcset="/museudememes/assets/|g' \
            {} \;

      - name: Montar diretório de deploy
        # Coloca o conteúdo de museudememes/ na raiz + pasta assets/
        # para que o GitHub Pages sirva corretamente em /museudememes/
        run: |
          mkdir -p _deploy
          cp -r _site/museudememes/. _deploy/
          cp -r _site/assets _deploy/assets
          cp _site/404.html _deploy/ 2>/dev/null || true
          cp _site/sitemap.xml _deploy/ 2>/dev/null || true
          cp _site/feed.xml _deploy/ 2>/dev/null || true
          touch _deploy/.nojekyll

      - name: Enviar artefato para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
