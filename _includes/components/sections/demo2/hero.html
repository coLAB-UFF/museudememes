<section class="wrapper bg-soft-primary">
  <div class="container pt-10 pb-19 pt-md-14 pb-md-20">
    <div class="row gx-md-8 gx-xl-12 gy-10 align-items-center">
      <div class="col-lg-6 order-lg-2">
        <figure>
          <img class="img-fluid rounded" src="{{ page.hero.image }}"
               srcset="{{ page.hero.image2x }} 2x" alt="">
        </figure>
      </div>
      <div class="col-lg-6">
        <h1 class="display-2 ls-sm mb-4">{{ page.hero.title }}</h1>
        <p class="lead fs-lg mb-7">{{ page.hero.subtitle }}</p>
        <div class="d-flex gap-2 flex-wrap">
          {% for btn in page.hero.buttons %}
          <a href="{{ btn.url }}" class="btn {{ btn.class }}">{{ btn.label }}</a>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>
