<section class="wrapper bg-light">
  <div class="container py-14 py-md-17">
    <div class="row gx-lg-8 gx-xl-12 gy-10 align-items-center">
      <div class="col-md-8 col-lg-6 col-xl-5 order-lg-2 position-relative">
        <div class="shape bg-soft-primary rounded-circle rellax w-20 h-20" data-rellax-speed="1" style="top: -2rem; right: -1.9rem;"></div>
        <figure class="rounded">
          <img src="{{ page.about1.image }}" srcset="{{ page.about1.image2x }} 2x" alt="{{ page.about1.image_alt | default: '' }}">
        </figure>
      </div>
      <!-- /column -->
      <div class="col-lg-6">
        <h2 class="display-4 mb-3">{{ page.about1.title }}</h2>
        <p class="lead fs-lg">{{ page.about1.lead }}</p>
        <p class="mb-6">{{ page.about1.text }}</p>
        <div class="row gx-xl-10 gy-6">
          {% for feature in page.about1.features %}
          <div class="col-md-6">
            <div class="d-flex flex-row">
              <div>
                <img src="/assets/img/icons/lineal/{{ feature.icon }}.svg" class="svg-inject icon-svg icon-svg-sm me-4" alt="" />
              </div>
              <div>
                <h4 class="mb-1">{{ feature.title }}</h4>
                <p class="mb-0">{{ feature.text }}</p>
              </div>
            </div>
          </div>
          <!-- /column -->
          {% endfor %}
        </div>
        <!-- /.row -->
      </div>
      <!-- /column -->
    </div>
    <!-- /.row -->
  </div>
  <!-- /.container -->
</section>
<!-- /section -->
