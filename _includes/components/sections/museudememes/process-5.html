<section class="wrapper bg-light">
  <div class="container py-14 py-md-17">
    <div class="row mb-5">
      <div class="col-md-10 col-xl-8 col-xxl-7 mx-auto text-center">
        <img src="{{ page.process5.icon }}" class="svg-inject icon-svg icon-svg-md mb-4" alt="" />
        <h2 class="display-4 mb-4 px-lg-14">{{ page.process5.title }}</h2>
      </div>
    </div>
    <!-- /.row -->
    <div class="row gx-md-8 gx-xl-12 gy-10 align-items-center">
      <div class="col-lg-6 order-lg-2">
        {% for step in page.process5.steps %}
        <div class="card {% if forloop.first %}me-lg-6{% elsif forloop.index == 2 %}ms-lg-13 mt-6{% else %}mx-lg-6 mt-6{% endif %}">
          <div class="card-body p-6">
            <div class="d-flex flex-row">
              <div>
                <span class="icon btn btn-circle btn-lg btn-soft-primary pe-none me-4">
                  <span class="number">{{ step.number }}</span>
                </span>
              </div>
              <div>
                <h4 class="mb-1">{{ step.title }}</h4>
                <p class="mb-0">{{ step.text }}</p>
              </div>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
      <!-- /column -->
      <div class="col-lg-6">
        <h2 class="display-6 mb-3">{{ page.process5.subtitle }}</h2>
        <p class="lead fs-lg pe-lg-5">{{ page.process5.description }}</p>
        <p>{{ page.process5.content1 }}</p>
        <p class="mb-6">{{ page.process5.content2 }}</p>
        <a href="{{ page.process5.button.url }}" class="btn btn-primary rounded-pill mb-0">{{ page.process5.button.text }}</a>
      </div>
      <!-- /column -->
    </div>
    <!-- /.row -->
  </div>
  <!-- /.container -->
</section>
<!-- /section -->
