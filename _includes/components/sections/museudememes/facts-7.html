<section class="wrapper bg-light">
  <div class="container py-14 py-md-17">
    <div class="row align-items-center gy-8">
      <div class="col-lg-7 text-center text-lg-start">
        <h2 class="fs-16 text-uppercase text-muted mb-3">{{ page.facts7.subtitle }}</h2>
        <h3 class="display-3 mb-5 pe-xl-10 pe-xxl-15">{{ page.facts7.title }} <span class="underline-3 style-2 yellow">{{ page.facts7.highlight }}</span> {{ page.facts7.title_end }}</h3>
        {% for paragraph in page.facts7.description %}
        <p class="{% unless forloop.last %}mb-3{% else %}mb-0{% endunless %}">{{ paragraph }}</p>
        {% endfor %}
      </div>
      <div class="col-lg-5">
        <div class="row gy-6 text-center">
          {% for item in page.facts7.items %}
          <div class="col-md-6">
            <div class="progressbar semi-circle {{ item.color }}" data-value="{{ item.value }}"></div>
            <h4 class="mb-0">{{ item.title }}</h4>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>
