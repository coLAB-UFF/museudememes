<section class="wrapper bg-light">
  <div class="container py-14 py-md-17">
    <div class="row gx-lg-8 gx-xl-12 gy-10 align-items-center">
      <div class="col-lg-6 position-relative">
        <div class="shape rounded bg-pale-{{ page.features5.shape_color }} rellax d-md-block" data-rellax-speed="0" style="top: 50%; left: 50%; width: 50%; height: 60%; transform: translate(-50%,-50%); z-index: 0;"></div>
        <div class="row gx-md-5 gy-5 position-relative">
          {% for column in page.features5.image_columns %}
          <div class="col-6">
            {% for image in column.images %}
            <img class="img-fluid rounded shadow-lg {{ image.classes }}"
                 src="{{ image.src }}"
                 {% if image.srcset != "" %}srcset="{{ image.srcset }}"{% endif %}
                 alt="{{ image.alt }}" />
            {% endfor %}
          </div>
          {% endfor %}
        </div>
      </div>
      <div class="col-lg-6">
        <h3 class="display-4 mb-5">{{ page.features5.title }}</h3>
        <p class="mb-5">{{ page.features5.description }}</p>
        <div class="row gy-3">
          {% for list in page.features5.lists %}
          <div class="col-xl-6">
            <ul class="icon-list bullet-bg bullet-soft-{{ page.features5.list_color }} mb-0">
              {% for item in list.items %}
              <li{% unless forloop.first %} class="mt-3"{% endunless %}>
                <span><i class="{{ page.features5.list_icon }}"></i></span>
                <span>{{ item }}</span>
              </li>
              {% endfor %}
            </ul>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>
