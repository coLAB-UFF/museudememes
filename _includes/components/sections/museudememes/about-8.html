<section class="wrapper bg-light">
  <div class="container py-14 py-md-17">
    <div class="row gy-10 gy-sm-13 gx-md-8 gx-xl-12 align-items-center">
      <div class="col-lg-6">
        <div class="row gx-md-5 gy-5">
          <div class="col-12">
            <figure class="rounded mx-md-5"><img src="{{ page.about8.main_image }}" srcset="{{ page.about8.main_image2x }} 2x" alt=""></figure>
          </div>
          <div class="col-md-6">
            <figure class="rounded"><img src="{{ page.about8.image2 }}" srcset="{{ page.about8.image2_2x }} 2x" alt=""></figure>
          </div>
          <div class="col-md-6">
            <figure class="rounded"><img src="{{ page.about8.image3 }}" srcset="{{ page.about8.image3_2x }} 2x" alt=""></figure>
          </div>
        </div>
        <!-- /.row -->
      </div>
      <!-- /column -->
      <div class="col-lg-6">
        <h2 class="fs-16 text-uppercase text-muted mb-3">{{ page.about8.subtitle }}</h2>
        <h3 class="display-3 mb-10">{{ page.about8.title_before }} <span class="underline-3 style-2 yellow">{{ page.about8.title_highlight }}</span> {{ page.about8.title_after }}</h3>
        <div class="row gy-8">
          {% for feature in page.about8.features %}
          <div class="col-md-6">
            <div class="d-flex flex-row">
              <div>
                <img src="{{ feature.icon }}" class="svg-inject icon-svg icon-svg-xs solid-mono {{ feature.icon_color }} me-4" alt="" />
              </div>
              <div>
                <h4 class="mb-1">{{ feature.title }}</h4>
                <p class="mb-0">{{ feature.description }}</p>
              </div>
            </div>
          </div>
          {% endfor %}
        </div>
        <!-- /.row -->
      </div>
      <!-- /column -->
    </div>
    <!-- /.row -->
  </div>
  <!-- /.container -->
</section>
<!-- /section -->
